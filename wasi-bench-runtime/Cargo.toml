[package]
name = "wasi-bench-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
wasmtime = "46"
# p3 is not a default feature; it pulls in wasmtime/component-model-async.
wasmtime-wasi = { version = "46", features = ["p3"] }
wasi-webgpu-wasmtime = "0.1.1"
